spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  application:
    name: icos
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:icos_db}
    username: ${DB_USER:safo}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      locations: classpath:graphql/
      printer:
        enabled: true
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_USERNAME}
    password: ${BREVO_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-signing-must-be-changed-in-production}
    access-token-ttl: ${JWT_EXPIRATION:900000}
    refresh-token-ttl: ${JWT_REFRESH_EXPIRATION:604800000}
  auth:
    refresh-token-ttl: 30d
    bcrypt-strength: 12
  invitation:
    base-url: ${INVITE_BASE_URL:http://localhost:3000/register}
    expiration-days: 7
    from-email: ${FROM_EMAIL:noreply@icos.com}

logging:
  level:
    com.safo.icos: DEBUG
    org.springframework.security: DEBUG
