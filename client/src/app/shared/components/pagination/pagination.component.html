@if (totalItems > 0) {
<div class="pagination-container">
  @if (showTotalInfo) {
  <div class="pagination-info">
    <span>Showing <strong>{{ startIndex() }}–{{ endIndex() }}</strong> of <strong>{{ totalItems }}</strong> items</span>
  </div>
  }

  <nav class="pagination-nav" aria-label="Pagination">
    <button
      type="button"
      class="pagination-btn pagination-prev"
      [disabled]="currentPage <= 1"
      (click)="prevPage()"
      aria-label="Previous page"
    >
      <ng-icon name="tablerChevronLeft" size="18"></ng-icon>
      <span class="btn-text">Previous</span>
    </button>

    <div class="pagination-pages">
      @for (item of pages(); track $index) {
        @if (isEllipsis(item)) {
          <span class="pagination-ellipsis" aria-hidden="true">&hellip;</span>
        } @else {
          <button
            type="button"
            class="pagination-btn pagination-page"
            [class.active]="item === currentPage"
            [attr.aria-current]="item === currentPage ? 'page' : null"
            [attr.aria-label]="'Page ' + item"
            (click)="goToPage(asNumber(item))"
          >
            {{ item }}
          </button>
        }
      }
    </div>

    <button
      type="button"
      class="pagination-btn pagination-next"
      [disabled]="currentPage >= totalPages()"
      (click)="nextPage()"
      aria-label="Next page"
    >
      <span class="btn-text">Next</span>
      <ng-icon name="tablerChevronRight" size="18"></ng-icon>
    </button>
  </nav>

  @if (showPageSizeSelector && pageSizeOptions.length > 0) {
  <div class="pagination-size">
    <label for="pagination-page-size" class="page-size-label">Per page:</label>
    <select
      id="pagination-page-size"
      class="page-size-select"
      [ngModel]="pageSize"
      (ngModelChange)="onPageSizeSelect($event)"
      aria-label="Items per page"
    >
      @for (size of pageSizeOptions; track size) {
        <option [value]="size">{{ size }}</option>
      }
    </select>
  </div>
  }
</div>
}
