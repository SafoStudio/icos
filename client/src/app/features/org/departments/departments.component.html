@if (!companyId()) {
<div class="loading-message">Loading company information...</div>
} @else {
<app-editable-table
  [columns]="columns"
  [data]="departments()"
  [loading]="loading()"
  [readOnly]="!canEdit()"
  (addItem)="onAddDepartment($event)"
  (updateItem)="onUpdateDepartment($event)"
  (deleteItem)="onDeleteDepartment($event)"
  (rowClick)="onRowClick($event)"
></app-editable-table>
}
