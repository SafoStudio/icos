<div>
  @if (!canEdit) {
  <p class="info">You have view-only access.</p>
  }

  <table class="permissions-table">
    <thead>
    <tr>
      <th>Permission</th>
      <th class="center">Specialist</th>
      <th class="center">Head</th>
    </tr>
    </thead>
    <tbody>
    @for (group of groupedPermissions(); track group.name) {
    <tr class="group-header-row">
      <td colspan="3" class="group-header">
        <span class="group-title">{{ getGroupLabel(group.name) }}</span>
        <span class="group-count">{{ group.permissions.length }}</span>
      </td>
    </tr>
    @for (perm of group.permissions; track perm.id) {
    <tr>
      <td>{{ perm.description }}</td>
      <td class="center">
        <label>
          <input
            type="checkbox"
            [checked]="isPermissionAssigned(perm, 'SPECIALIST')"
            [disabled]="!canEdit || saving"
            (change)="onToggle(perm, 'SPECIALIST')"
          />
        </label>
      </td>
      <td class="center">
        <label>
          <input
            type="checkbox"
            [checked]="isPermissionAssigned(perm, 'HEAD')"
            [disabled]="!canEdit || saving"
            (change)="onToggle(perm, 'HEAD')"
          />
        </label>
      </td>
    </tr>
    }
    }
    </tbody>
  </table>
</div>
