<table class="members-table">
  <thead>
  <tr>
    <th>Position</th>
    <th>Name</th>
  </tr>
  </thead>
  <tbody>
  @if (members.length === 0) {
  <tr>
    <td colspan="2" class="empty-message">No members assigned to this department.</td>
  </tr>
  } @else {
  @for (user of members; track user.id) {
  <tr
    (click)="onRowClick(user)"
    (keydown.enter)="onRowClick(user)"
    (keydown.space)="onRowClick(user)"
    tabindex="0"
  >
    <td>
            <span class="role-badge" [class.head]="getRole(user) === 'HEAD'">
              {{ getRole(user) }}
            </span>
    </td>
    <td>
      <button class="member-link" (click)="onRowClick(user)">
        {{ user.firstName }} {{ user.lastName }}
      </button>
    </td>
  </tr>
  }
  }
  </tbody>
</table>
