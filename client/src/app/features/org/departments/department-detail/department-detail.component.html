<div class="department-detail">
  <div class="header">
    <button class="btn-back" (click)="goBack()">← Back</button>
    <h1>{{ department()?.name || 'Loading...' }}</h1>
  </div>

  @if (department()?.description) {
  <p class="description">{{ department()?.description }}</p>
  }

  @if (loading()) {
  <div class="loading">Loading...</div>
  } @else {
  <div class="content-grid">
    <div class="permissions-col">
      <app-department-permissions
        [allPermissions]="allPermissions()"
        [headPermissions]="headPermissions()"
        [specialistPermissions]="specialistPermissions()"
        [canEdit]="canEdit()"
        [saving]="saving()"
        (togglePermission)="onTogglePermission($event)"></app-department-permissions>
    </div>

    <div class="members-col">
      <app-department-members
        [members]="members()"
        [headUser]="headUser()"
        (memberClick)="onMemberClick($event)"></app-department-members>
    </div>
  </div>
  }
</div>
