@if (!companyId()) {
<div class="loading-message">Loading company information...</div>
} @else {
<app-editable-table
  [columns]="columns"
  [data]="positions()"
  [loading]="loading()"
  [readOnly]="!canEdit()"
  (addItem)="onAddPosition($event)"
  (updateItem)="onUpdatePosition($event)"
  (deleteItem)="onDeletePosition($event)"></app-editable-table>
}
