<div class="org-page">
  <div class="page-header">
    <div class="title-badge">
      <ng-icon name="tablerBuildingCommunity" size="20" class="badge-icon" aria-hidden="true"></ng-icon>
      <span class="badge-text">Organization Management</span>
    </div>
    <p class="header-subtitle">Manage your company departments and positions</p>
  </div>

  @if (showTabs()) {
  <app-tabs
    [tabs]="tabs"
    [activeTabId]="activeTabId()"
    (tabChange)="onTabChange($event)"
  >
    <router-outlet></router-outlet>
  </app-tabs>
  } @else {
  <div class="detail-container">
    <router-outlet></router-outlet>
  </div>
  }
</div>
