<header class="header-section">
  <div class="header-text">
    <div class="title-badge">
      <h3>Custom Fields & Dynamic Forms</h3>
    </div>
    <p class="section-desc">
      Extend Candidate cards, Job vacancies, User profiles, and Onboarding workflows with custom data fields, validations, and conditional logic.
    </p>
  </div>

  <div class="header-actions">
    <button
      type="button"
      class="btn btn-secondary btn-playground"
      (click)="openPlayground.emit()"
      aria-label="Open dynamic form playground"
    >
      <ng-icon name="tablerSparkles" size="18" aria-hidden="true"></ng-icon>
      <span>Test Form Playground</span>
    </button>

    <button
      type="button"
      class="btn btn-primary btn-add-field"
      (click)="openCreate.emit()"
      aria-label="Create new custom field definition"
    >
      <ng-icon name="tablerPlus" size="18" aria-hidden="true"></ng-icon>
      <span>New Custom Field</span>
    </button>
  </div>
</header>
