<dialog
  class="modal-overlay"
  (click)="closeModal()"
  (keydown.esc)="closeModal()"
  [open]="true"
  (close)="closeModal()"
>
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modal-title" class="modal-title">Profile Photo</h3>
      <button class="btn-icon-close" (click)="closeModal()" aria-label="Close modal" type="button">
        <ng-icon name="tablerX" size="20"></ng-icon>
      </button>
    </div>

    <div class="modal-body">
      @if (!imageLoaded()) {
      <div
        class="dropzone"
        [class.dragging]="isDraggingFile()"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
        (click)="triggerFileInput()"
        (keydown.enter)="triggerFileInput()"
        (keydown.space)="$event.preventDefault(); triggerFileInput()"
        [attr.aria-label]="'Upload photo, click or drag and drop'"
      >
        <input
          #fileInput
          type="file"
          accept="image/png, image/jpeg, image/webp"
          class="file-input-hidden"
          (change)="onFileChange($event)"
        />

        <div class="dropzone-content">
          <div class="icon-circle">
            <ng-icon name="tablerCamera" size="36"></ng-icon>
          </div>
          <h4 class="drop-title">Upload a photo</h4>
          <p class="drop-subtitle">Drag and drop an image here, or click to browse</p>
          <span class="file-hint">Supports PNG, JPG, WEBP</span>
        </div>
      </div>
      } @else {
      <div class="cropper-container">
        <div
          class="cropper-viewport"
          (mousedown)="startPan($event)"
          (touchstart)="startPan($event)"
          (wheel)="onWheelZoom($event)"
        >
          <canvas #cropCanvas width="300" height="300" class="crop-canvas"></canvas>
          <div class="viewport-overlay"></div>
          <div class="viewport-guide"></div>
        </div>

        <p class="cropper-hint">
          <ng-icon name="tablerInfoCircle" size="14"></ng-icon>
          Drag image to adjust position • Scroll or slider to zoom
        </p>

        <div class="cropper-toolbar">
          <div class="zoom-control">
            <button class="btn-tool" (click)="zoomOut()" title="Zoom out" [disabled]="zoomLevel() <= 0.5" type="button">
              <ng-icon name="tablerZoomOut" size="18"></ng-icon>
            </button>
            <input
              type="range"
              min="0.5"
              max="3.0"
              step="0.05"
              [ngModel]="zoomLevel()"
              (ngModelChange)="onZoomChange($event)"
              class="zoom-slider"
              aria-label="Zoom level"
            />
            <button class="btn-tool" (click)="zoomIn()" title="Zoom in" [disabled]="zoomLevel() >= 3.0" type="button">
              <ng-icon name="tablerZoomIn" size="18"></ng-icon>
            </button>
          </div>

          <div class="tool-buttons">
            <button class="btn-tool-secondary" (click)="centerImage()" title="Center photo" type="button">
              <ng-icon name="tablerFocus2" size="16"></ng-icon>
              <span>Center</span>
            </button>

            <button class="btn-tool-secondary" (click)="rotateClockwise()" title="Rotate 90°" type="button">
              <ng-icon name="tablerRotateClockwise" size="16"></ng-icon>
              <span>Rotate</span>
            </button>

            <button class="btn-tool-secondary" (click)="triggerFileInput()" title="Choose another file" type="button">
              <ng-icon name="tablerUpload" size="16"></ng-icon>
              <span>Change</span>
            </button>
          </div>
        </div>

        <input
          #fileInput
          type="file"
          accept="image/png, image/jpeg, image/webp"
          class="file-input-hidden"
          (change)="onFileChange($event)"
        />
      </div>
      }
    </div>

    <div class="modal-footer">
      <div class="left-actions">
        @if (hasExistingAvatar && !saving()) {
        <button class="btn-delete" (click)="deleteAvatar()" [disabled]="deleting()" type="button">
          <ng-icon name="tablerTrash" size="16"></ng-icon>
          <span>{{ deleting() ? 'Deleting...' : 'Delete Photo' }}</span>
        </button>
        }
      </div>

      <div class="right-actions">
        <button class="btn-cancel" (click)="closeModal()" [disabled]="saving() || deleting()" type="button">
          Cancel
        </button>

        @if (imageLoaded()) {
        <button class="btn-save" (click)="saveAvatar()" [disabled]="saving() || deleting()" type="button">
          @if (saving()) {
          <span class="spinner-sm"></span>
          Saving...
          } @else {
          Save Photo
          }
        </button>
        }
      </div>
    </div>
  </div>
</dialog>
