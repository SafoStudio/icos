<div class="dashboard-container">
  <div class="welcome-banner">
    <h1>Welcome back, {{ userName() }}!</h1>
    <p class="subtitle">Here's what's happening at your workspace today.</p>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-title">Role</div>
      <div class="metric-value">{{ companyRole() }}</div>
      <div class="metric-desc">Your current workspace role</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Candidates</div>
      <div class="metric-value">12</div>
      <div class="metric-desc">4 scheduled interviews today</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Active Vacancies</div>
      <div class="metric-value">6</div>
      <div class="metric-desc">2 new applications received</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Tasks</div>
      <div class="metric-value">8</div>
      <div class="metric-desc">3 tasks pending your review</div>
    </div>
  </div>
</div>
